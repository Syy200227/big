project_name: "EG-GM-PUNet-v2"
experiment_name: "eg_gm_punet_v2_demand_capacity_k5_lidc_full"

data_root: "E:/workspace/EG-GM-PUNet/dataset/processed_lidc_128_allpos_full"
save_dir: "E:/workspace/EG-GM-PUNet/result/eg_gm_punet_v2_demand_capacity_k5_full"

seed: 2026
validation_seed: 12026
device: "cuda"
resume: null

# 为了与 No-Feedback / Fixed EG-ALC / Stage 1 公平比较，
# Stage 2 仍然从同一个 V2-B probability checkpoint 开始，
# Evidence Head 随机初始化；不要从 Stage 1 checkpoint 接着训练。
initialization:
  mode: "probabilistic"
  joint_checkpoint: "E:/workspace/EG-GM-PUNet/result/v3_evidential_multiscale_grouped_gmm_k5_full/best_val_joint_loss_v3_evidential.pth"
  probabilistic_checkpoint: "E:/workspace/EG-GM-PUNet/result/v2b_multiscale_grouped_gmm_k5/best_val_ged4_multiscale_grouped_gmm.pth"
  strict: true

  probabilistic_feedback_start_epoch: 21
  probabilistic_freeze_probabilistic_epochs: 5
  joint_feedback_start_epoch: 1
  joint_freeze_probabilistic_epochs: 2

model:
  in_channels: 1
  num_classes: 2
  num_components: 5

  latent_dims:
    coarse: 2
    middle: 2
    fine: 2

  num_channels: [32, 64, 128, 192, 192, 192, 192]

  group_feature_indices:
    coarse: 6
    middle: 3
    fine: 0

  group_decoder_indices:
    coarse: 3
    middle: 2
    fine: 0

  num_convs_per_block: 3
  fusion_1x1_convs: 1
  segmentation_head_1x1_convs: 3
  min_log_sigma: null
  max_log_sigma: null

  evidence_projection_channels: 32
  evidence_fusion_channels: 64

  feedback:
    enabled: true
    start_epoch: 21
    ramp_epochs: 20

    # 唯一经 Stage 0.5b + Stage 1 验证过的 ambiguity demand。
    demand_scale: "fine"

    demand_ema_decay: 0.99
    demand_min_std: 0.01
    demand_z_clip: 2.0
    demand_relative_temperature: 1.0

    # coarse/middle/fine continuous capacity 的 KL running normalization。
    capacity_ema_decay: 0.99
    capacity_min_std: 0.01
    capacity_z_clip: 2.0
    capacity_relative_temperature: 1.0

    # Stage 1 发现 demand-only 会增加 diversity 但损失 fidelity。
    # 因此 Stage 2 保留一个温和 conservative fidelity anchor，
    # 再由 demand-capacity error 做病例级修正。
    categorical_beta_anchor: 1.20
    group_beta_anchors:
      coarse: 1.20
      middle: 1.20
      fine: 1.20
    temperature_anchor: 0.90

    categorical_error_strength: 1.00
    group_error_strengths:
      coarse: 1.00
      middle: 1.00
      fine: 1.00
    temperature_error_strength: 0.70

    beta_ratio_min: 0.50
    beta_ratio_max: 2.00
    temperature_min: 0.50
    temperature_max: 1.50

training:
  epochs: 150
  batch_size: 4
  num_workers: 0
  freeze_probabilistic_epochs: 5

  beta_categorical: 1.0
  beta_groups:
    coarse: 1.0
    middle: 1.0
    fine: 1.0
  gumbel_temperature: 1.0

  feedback_enabled: true
  categorical_feedback: true
  group_feedback: true
  temperature_feedback: true

  evidence_weight: 0.1
  evidence_dice_weight: 1.0
  evidence_kl_weight: 1.0
  evidence_calibration_weight: 1.0
  evidence_auxiliary_scale_weight: 0.1
  evidential_annealing_epochs: 20

  probabilistic_learning_rate_values:
    - 0.00001
    - 0.000005
    - 0.000001
    - 0.0000005

  evidence_learning_rate_values:
    - 0.0001
    - 0.00005
    - 0.00001
    - 0.0000005

  learning_rate_boundary_fractions:
    - 0.333333
    - 0.666667
    - 1.0

  regularization_weight: 0.00001
  save_every_epochs: 10

validation:
  rater_index: 0
  prior_samples_each_epoch: 4
  ece_bins: 15
  ranking_bins: 200

evaluation:
  final_prior_samples: 16
  sample_counts: [1, 4, 8, 16]

  # 从 Stage 2 开始固定的数据保存规范。
  save_all_case_artifacts: true
  save_input_image: true
  save_generated_probabilities: false
  artifact_float_dtype: "float16"
  active_component_threshold: 0.02
